global:
  scrape_interval: 5s        # how often Prometheus pulls /metrics (15s is a typical prod default)
  evaluation_interval: 5s

scrape_configs:
  - job_name: "greenlight-api"
    static_configs:
      # host.docker.internal lets the Prometheus container reach
      # your API running on the host machine (works on macOS/Windows).
      - targets: ["host.docker.internal:4000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]